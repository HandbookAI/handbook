<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="620" viewBox="0 0 1120 620" role="img" aria-label="Handbook monorepo architecture: eleven packages in four layers with a strictly one-way dependency direction">
  <title>Handbook — capas de paquetes</title>
  <desc>Cuatro capas. Los puntos de entrada (cli, studio) dependen de los paquetes de capacidades (pipeline, renderer, skill, planner, patcher, resync), que dependen de los motores (analyzer, llm), que dependen de core. Las dependencias solo apuntan hacia abajo.</desc>

  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0B1020"/>
      <stop offset="60%" stop-color="#101733"/>
      <stop offset="100%" stop-color="#0C1226"/>
    </linearGradient>
    <linearGradient id="lane" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#161E3C" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#121933" stop-opacity="0.9"/>
    </linearGradient>
    <marker id="dep" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5C6AA0"/>
    </marker>
    <style>
      .t   { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
      .m   { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace; }
      .h1  { fill:#F2F5FF; font-size:25px; font-weight:700; letter-spacing:-0.3px; }
      .sub { fill:#8C9AC4; font-size:14px; }
      .lane{ fill:#68779F; font-size:11.5px; font-weight:800; letter-spacing:1.4px; }
      .pkg { fill:#F2F5FF; font-size:15px; font-weight:700; }
      .role{ fill:#93A2CC; font-size:11.5px; }
      .leg { fill:#93A2CC; font-size:12.5px; }
    </style>
  </defs>

  <rect width="1120" height="620" rx="18" fill="url(#bg2)"/>
  <rect x="0.5" y="0.5" width="1119" height="619" rx="18" fill="none" stroke="#232C4E"/>

  <text class="t h1" x="40" y="48">Once paquetes. Las dependencias solo apuntan hacia abajo.</text>
  <text class="t sub" x="40" y="72">Todo lo que toca un LLM está acotado en dos paquetes — el resto es determinista y reutilizable por sí solo.</text>

  <!-- lane 4: entry points -->
  <rect x="40" y="98" width="1040" height="94" rx="13" fill="url(#lane)" stroke="#2E3A66"/>
  <text class="t lane" x="60" y="120">PUNTOS DE ENTRADA · lo que ejecuta un humano o un contenedor</text>
  <rect x="60" y="130" width="330" height="48" rx="10" fill="#1E2A52" stroke="#3D4E86"/>
  <text class="m pkg" x="78" y="152">@handbook/cli</text>
  <text class="t role" x="78" y="169">el binario `handbook` — 11 subcomandos</text>
  <rect x="410" y="130" width="330" height="48" rx="10" fill="#1E2A52" stroke="#3D4E86"/>
  <text class="m pkg" x="428" y="152">@handbook/studio</text>
  <text class="t role" x="428" y="169">UI web local en 127.0.0.1, jobs + logs en vivo</text>
  <rect x="760" y="130" width="300" height="48" rx="10" fill="#141B36" stroke="#2A3357" stroke-dasharray="4 4"/>
  <text class="t role" x="775" y="150" fill="#7E8CB6">Ambos resuelven la config desde el MISMO</text>
  <text class="t role" x="775" y="167" fill="#7E8CB6">registro — flags, env, YAML, defaults.</text>

  <!-- lane 3: capabilities -->
  <rect x="40" y="208" width="1040" height="166" rx="13" fill="url(#lane)" stroke="#2E3A66"/>
  <text class="t lane" x="60" y="230">CAPACIDADES · una tarea cada uno, usables por separado</text>

  <rect x="60" y="242" width="322" height="56" rx="10" fill="#16233F" stroke="#2F6F68"/>
  <rect x="60" y="242" width="4" height="56" rx="2" fill="#2DD4BF"/>
  <text class="m pkg" x="78" y="265">@handbook/pipeline</text>
  <text class="t role" x="78" y="284">phases 1 → 3, estrategias file y member</text>

  <rect x="399" y="242" width="322" height="56" rx="10" fill="#16233F" stroke="#2F6F68"/>
  <rect x="399" y="242" width="4" height="56" rx="2" fill="#2DD4BF"/>
  <text class="m pkg" x="417" y="265">@handbook/renderer</text>
  <text class="t role" x="417" y="284">markdown · HTML · índice de agente · llms.txt</text>

  <rect x="738" y="242" width="322" height="56" rx="10" fill="#16233F" stroke="#2F6F68"/>
  <rect x="738" y="242" width="4" height="56" rx="2" fill="#2DD4BF"/>
  <text class="m pkg" x="756" y="265">@handbook/skill</text>
  <text class="t role" x="756" y="284">empaquetado SKILL, validación, hashes de deriva</text>

  <rect x="60" y="308" width="322" height="56" rx="10" fill="#16233F" stroke="#2F6F68"/>
  <rect x="60" y="308" width="4" height="56" rx="2" fill="#2DD4BF"/>
  <text class="m pkg" x="78" y="331">@handbook/planner</text>
  <text class="t role" x="78" y="350">bucle de agente de solo lectura → plan preciso</text>

  <rect x="399" y="308" width="322" height="56" rx="10" fill="#16233F" stroke="#2F6F68"/>
  <rect x="399" y="308" width="4" height="56" rx="2" fill="#2DD4BF"/>
  <text class="m pkg" x="417" y="331">@handbook/patcher</text>
  <text class="t role" x="417" y="350">apply exacto al byte · backups · rollback</text>

  <rect x="738" y="308" width="322" height="56" rx="10" fill="#16233F" stroke="#2F6F68"/>
  <rect x="738" y="308" width="4" height="56" rx="2" fill="#2DD4BF"/>
  <text class="m pkg" x="756" y="331">@handbook/resync</text>
  <text class="t role" x="756" y="350">avance incremental guiado por diffs</text>

  <!-- lane 2: engines -->
  <rect x="40" y="390" width="1040" height="94" rx="13" fill="url(#lane)" stroke="#2E3A66"/>
  <text class="t lane" x="60" y="412">MOTORES · la base sobre la que se construye todo lo demás</text>
  <rect x="60" y="422" width="490" height="48" rx="10" fill="#16233F" stroke="#2F6F68"/>
  <rect x="60" y="422" width="4" height="48" rx="2" fill="#2DD4BF"/>
  <text class="m pkg" x="80" y="444">@handbook/analyzer</text>
  <text class="t role" x="80" y="461">tree-sitter WASM · 18 lenguajes · sin build nativo, sin LLM</text>
  <rect x="570" y="422" width="490" height="48" rx="10" fill="#2A2440" stroke="#7A6535"/>
  <rect x="570" y="422" width="4" height="48" rx="2" fill="#FBBF24"/>
  <text class="m pkg" x="590" y="444">@handbook/llm</text>
  <text class="t role" x="590" y="461">cualquier endpoint compatible con OpenAI · retry · caché · actor–crítico</text>

  <!-- lane 1: core -->
  <rect x="40" y="500" width="1040" height="76" rx="13" fill="url(#lane)" stroke="#2E3A66"/>
  <text class="t lane" x="60" y="522">CIMIENTOS · cero dependencias de terceros en runtime aparte de zod + yaml</text>
  <rect x="60" y="532" width="1000" height="30" rx="8" fill="#16233F" stroke="#2F6F68"/>
  <rect x="60" y="532" width="4" height="30" rx="2" fill="#2DD4BF"/>
  <text class="m pkg" x="80" y="553" font-size="14">@handbook/core</text>
  <text class="t role" x="230" y="553">IR del grafo de llamadas + modelo del handbook · esquemas zod · registro de config · logger · E/S atómica de archivos · locks</text>

  <!-- dependency arrows (downward only; kept clear of the lane captions) -->
  <line x1="620" y1="192" x2="620" y2="236" stroke="#5C6AA0" stroke-width="1.6" marker-end="url(#dep)"/>
  <line x1="920" y1="192" x2="920" y2="236" stroke="#5C6AA0" stroke-width="1.6" marker-end="url(#dep)"/>
  <line x1="620" y1="374" x2="620" y2="416" stroke="#5C6AA0" stroke-width="1.6" marker-end="url(#dep)"/>
  <line x1="800" y1="374" x2="800" y2="416" stroke="#5C6AA0" stroke-width="1.6" marker-end="url(#dep)"/>
  <line x1="1000" y1="374" x2="1000" y2="416" stroke="#5C6AA0" stroke-width="1.6" marker-end="url(#dep)"/>
  <line x1="700" y1="484" x2="700" y2="526" stroke="#5C6AA0" stroke-width="1.6" marker-end="url(#dep)"/>
  <line x1="950" y1="484" x2="950" y2="526" stroke="#5C6AA0" stroke-width="1.6" marker-end="url(#dep)"/>

  <!-- legend -->
  <rect x="40" y="588" width="14" height="14" rx="4" fill="#2DD4BF"/>
  <text class="t leg" x="62" y="600">determinista — sin LLM, sin red</text>
  <rect x="330" y="588" width="14" height="14" rx="4" fill="#FBBF24"/>
  <text class="t leg" x="352" y="600">habla con un endpoint LLM</text>
  <text class="t leg" x="560" y="600" fill="#68779F">Un ciclo o un import ascendente rompe `pnpm check:workspace` — exigido, no solo documentado.</text>
</svg>
