packages:
  - packages/*

# Single source of truth for every third-party version in the repo.
#
# Packages depend on these as `"zod": "catalog:"` and never restate a range, so
# a version can only be changed in one place and can never drift between the
# eleven packages. `scripts/check-workspace.mjs` enforces that: any non-workspace
# dependency written as a literal range is a build failure.
#
# pnpm rewrites `catalog:` to the resolved range when packing or publishing, so
# consumers never see the protocol.
catalog:
  # --- runtime ---
  commander: ^15.0.0
  markdown-it: ^15.0.0
  # 0.1.13 already ships the java/c#/c/c++/ruby/php/swift/dart/solidity/kotlin/
  # scala grammars, so adding a language needs no new dependency. Its bundled
  # tree-sitter-lua grammar is broken (order-dependent results) — do not adopt it.
  tree-sitter-wasms: ^0.1.13
  # Must stay on 0.25.x: 0.26 changed the WASM ABI and fails to load the
  # grammars above. Pinned with ~ so a minor bump cannot slip in.
  web-tree-sitter: ~0.25.10
  yaml: ^2.9.0
  zod: ^4.0.0

  # --- types ---
  '@types/markdown-it': ^14.0.0
  '@types/node': ^26.2.0

  # --- toolchain ---
  '@arethetypeswrong/cli': ^0.18.0
  '@changesets/cli': ^2.29.0
  '@commitlint/cli': ^21.2.1
  '@commitlint/config-conventional': ^21.2.0
  '@eslint/js': ^10.0.1
  '@vitest/coverage-v8': ^4.0.0
  eslint: ^10.8.1
  globals: ^17.9.0
  husky: ^9.1.0
  lint-staged: ^17.3.0
  publint: ^0.3.0
  prettier: ^3.9.6
  typescript: ^7.0.2
  typescript-eslint: ^8.66.0
  vitest: ^4.0.0
