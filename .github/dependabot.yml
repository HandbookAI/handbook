# Dependency updates arrive as PRs that run the full `check` gate, so an update
# that breaks the build is visible before anyone merges it.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: 'chore(deps)'
      prefix-development: 'chore(deps)'
    groups:
      # One PR for the toolchain rather than eight. These move together and are
      # verified by the same command.
      toolchain:
        patterns:
          - '@changesets/*'
          - '@commitlint/*'
          - '@eslint/*'
          - '@vitest/*'
          - eslint
          - eslint-*
          - globals
          - husky
          - lint-staged
          - prettier
          - typescript
          - typescript-eslint
          - vitest
    ignore:
      # 0.26 changed the WASM ABI and cannot load the grammars in
      # tree-sitter-wasms. Bumping it is a deliberate migration, not a chore.
      - dependency-name: web-tree-sitter
        update-types: [version-update:semver-minor, version-update:semver-major]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: 'chore(ci)'
