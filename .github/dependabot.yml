# Dependency updates arrive as PRs that run the full `check` gate, so an update
# that breaks the build is visible before anyone merges it.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: 'chore(deps)'
      prefix-development: 'chore(deps)'
    groups:
      # One PR for the toolchain rather than eight. These move together and are
      # verified by the same command.
      toolchain:
        patterns:
          - '@changesets/*'
          - '@commitlint/*'
          - '@eslint/*'
          - '@vitest/*'
          - eslint
          - eslint-*
          - globals
          - husky
          - lint-staged
          - prettier
          - typescript
          - typescript-eslint
          - vitest
    ignore:
      # 0.26 changed the WASM ABI and cannot load the grammars in
      # tree-sitter-wasms. Bumping it is a deliberate migration, not a chore.
      - dependency-name: web-tree-sitter
        update-types: [version-update:semver-minor, version-update:semver-major]

  # The documentation site is a SEPARATE workspace with its own lockfile, which
  # the root entry above cannot see. Without this it would never be updated at
  # all — and it carries the largest dependency surface in the repo (Next,
  # React, Tailwind, fumadocs).
  - package-ecosystem: npm
    directory: /docs
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    commit-message:
      prefix: 'chore(deps)'
      prefix-development: 'chore(deps)'
    groups:
      # These are versioned together upstream and break together downstream.
      next:
        patterns: ['next', 'react', 'react-dom', '@types/react', '@types/react-dom']
      fumadocs:
        patterns: ['fumadocs-*']
      tailwind:
        patterns: ['tailwindcss', '@tailwindcss/*', 'postcss']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: 'chore(ci)'
