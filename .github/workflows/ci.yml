# Monorepo CI.
#
# Independent gates, so a failure names its own cause. Everything they run is a
# script that also runs locally — `pnpm check`, `pnpm check:packaging`,
# `pnpm run check:install`, `pnpm run check:cli` — so a red job can be reproduced
# on a laptop instead of debugged by pushing commits.
#
# Two of these gates exist because of bugs that shipped past all the others:
#
#   - `docs` builds the documentation site. It is a SEPARATE pnpm workspace with
#     its own lockfile, so a root `pnpm install` never sees it and `pnpm check`
#     never compiles a line of it. It could break entirely and every other job
#     here would stay green.
#   - the browser steps drive real Chrome. A page whose JavaScript is blocked
#     still server-renders perfectly and passes every fetch-based check while
#     being completely inert — search, theme, language and sidebar all dead.
#     Only a browser notices.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A pull request that gets a second push cancels the first run. Without this,
# `on: push` + `on: pull_request` also meant every PR commit was built twice.
# Pushes to main are never cancelled: main's history should stay fully verified.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  check:
    name: check (${{ matrix.os }}, node ${{ matrix.node-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        # Linux carries the supported Node range; the other two platforms run
        # the current version. This is not box-ticking: the patcher's
        # symlink-escape guard (lstat/realpath), core's mkdir-based directory
        # lock, and every path the analyzer normalises behave differently on
        # Windows, and nothing in this repo branches on `process.platform`.
        os: [ubuntu-latest]
        node-version: [20, 24]
        include:
          - os: macos-latest
            node-version: 24
          - os: windows-latest
            node-version: 24
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      # Installs the pnpm version pinned in package.json's "packageManager".
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          # Caches the pnpm store keyed on pnpm-lock.yaml.
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # tsc -b + tsconfig.tests.json + workspace invariants + eslint + prettier
      # + vitest with per-package coverage floors.
      - run: pnpm check

      - name: Upload coverage report
        # Vitest writes the report only when the run passes, so this is a
        # no-op on a red build — `ignore` keeps that from adding a second,
        # meaningless annotation on top of the real failure.
        if: ${{ always() && matrix.os == 'ubuntu-latest' && matrix.node-version == 24 }}
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/
          retention-days: 14
          if-no-files-found: ignore

  packaging:
    name: packaging (publint + attw)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # Packs each package and checks what a consumer would actually receive:
      # manifest/tarball agreement, and whether the type declarations resolve.
      - run: pnpm check:packaging

  smoke:
    name: smoke (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        # Runs on Windows too: this is the job that would catch a path or an
        # asset that only resolves on a POSIX filesystem.
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # Packs all eleven packages, installs the tarballs into an empty project
      # with plain npm — no workspace, no symlinks — and drives the CLI through
      # analyze → generate → render → skill → validate against the offline mock.
      # The only gate here that tests what users actually receive.
      - run: pnpm run check:install

  cli:
    name: cli surface (every subcommand, every layer)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # The unit tests mock `generateHandbook` and friends, so they cannot catch
      # a flag that resolves correctly and is then never passed on, a wrong exit
      # code, or an artifact contract that broke at the seam. This drives the
      # real binary against the offline mock and asserts on exit codes and
      # artifacts — every subcommand, the config cascade, and the refusals.
      - run: pnpm run check:cli

  docs:
    name: docs site (build + browser)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          # `docs/` is its own workspace with its own lockfile. Keying the cache
          # on the ROOT lockfile would reuse a store that has none of its deps.
          cache-dependency-path: docs/pnpm-lock.yaml

      - name: Install the docs workspace
        working-directory: docs
        run: pnpm install --frozen-lockfile

      - name: Cache the Next.js build
        uses: actions/cache@v4
        with:
          path: docs/.next/cache
          key: next-${{ hashFiles('docs/pnpm-lock.yaml') }}-${{ hashFiles('docs/**/*.ts', 'docs/**/*.tsx', 'docs/content/**') }}
          restore-keys: next-${{ hashFiles('docs/pnpm-lock.yaml') }}-

      # A translation can be fluent and still broken: a dropped code fence, an
      # unclosed <Callout>, a link whose href got localized, a command
      # translated inside a shell block. Nobody on the team reads all eight
      # languages, and only some of that fails the MDX build — so it is checked
      # mechanically against the English source instead.
      - name: Check translation integrity
        run: node docs/scripts/check-translations.mjs

      - name: Typecheck
        working-directory: docs
        run: pnpm run types:check

      - name: Build
        working-directory: docs
        run: pnpm run build

      - name: Serve the production build
        working-directory: docs
        run: |
          set -euo pipefail
          pnpm start -p 3000 > /tmp/next-start.log 2>&1 &
          for _ in $(seq 1 60); do
            if curl -fsS -o /dev/null http://127.0.0.1:3000/docs; then
              echo "up"; exit 0
            fi
            sleep 1
          done
          echo "the docs server never came up:"; cat /tmp/next-start.log; exit 1

      # Search, the theme toggle, the language menu and the sidebar collapse are
      # all client components. This is the only gate that proves they respond.
      - name: Browser-test the docs site
        run: node scripts/browser/docs-site.mjs http://127.0.0.1:3000

      - name: Upload the server log
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: docs-server-log
          path: /tmp/next-start.log
          retention-days: 7
          if-no-files-found: ignore

  demo:
    name: demo (offline, via the shell entry point)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # The smoke job covers the same pipeline through the published packages.
      # This one covers examples/run-demo.sh itself — the entry point the README
      # tells a new user to run first, which nothing else exercises.
      - run: pnpm demo

      - name: Assert the demo produced its artefacts
        run: |
          set -euo pipefail
          work=examples/work/demo
          for artefact in \
            "$work/handbook/overview.md" \
            "$work/handbook/handbook.html" \
            "$work/handbook/html/overview.html" \
            "$work/handbook/html/search-index.js" \
            "$work/skill/SKILL.md"
          do
            test -s "$artefact" || { echo "missing or empty: $artefact"; exit 1; }
          done
          echo "demo artefacts OK"

      # The rendered handbook is a human-facing artifact that opens from file://
      # with no server. Its search, theme, disclosure and deep-link behaviour is
      # inlined JavaScript that no string assertion can exercise.
      - name: Browser-test the rendered handbook
        run: |
          node scripts/browser/handbook-html.mjs \
            examples/work/demo/handbook/html \
            examples/work/demo/handbook/handbook.html

      # Studio's UI is one hand-written HTML file with no framework and no
      # build step: nothing type-checks it, and only a browser renders it.
      - name: Browser-test the Studio UI
        run: |
          set -euo pipefail
          node packages/cli/dist/main.js studio --port 4860 --state-dir "$(mktemp -d)" \
            > /tmp/studio.log 2>&1 &
          for _ in $(seq 1 40); do
            if curl -fsS -o /dev/null http://127.0.0.1:4860/; then break; fi
            sleep 1
          done
          node scripts/browser/studio-ui.mjs http://127.0.0.1:4860
          # A generate is minutes of silence unless something reports. Three of
          # the four passes had their progress sinks declared and never wired;
          # only driving a real run through the stream caught it.
          node scripts/browser/studio-progress.mjs http://127.0.0.1:4860 packages/core/src
          # render / skill / validate were covered at the API level only, which
          # says nothing about whether the buttons are reachable, the dialogs
          # open, their fields reach the request, or a refusal is shown rather
          # than swallowed. Offline: these are the three commands that never
          # reach a model, and the handbook `pnpm demo` just produced is the
          # input they need.
          node scripts/browser/studio-dialogs.mjs http://127.0.0.1:4860 \
            examples/demo-project examples/work/demo

      - name: Upload the generated handbook
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: demo-output
          path: examples/work/demo/
          retention-days: 7
          if-no-files-found: ignore

  shell:
    name: shellcheck
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      # shellcheck is preinstalled on the ubuntu runner image. Every tracked
      # script, not a hand-kept list: the demo entry points, the CLI smoke
      # suite, and the agent hooks. A list goes stale the first time someone
      # adds a script, and silently — which is how the hooks went unlinted.
      - name: Lint every tracked shell script
        run: |
          set -euo pipefail
          mapfile -t scripts < <(git ls-files '*.sh')
          printf 'linting %d script(s):\n' "${#scripts[@]}"
          printf '  %s\n' "${scripts[@]}"
          shellcheck "${scripts[@]}"

  commits:
    name: commitlint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: ${{ github.event_name == 'pull_request' }}
    steps:
      - uses: actions/checkout@v4
        with:
          # commitlint needs the full range of the PR's commits.
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: >-
          pnpm commitlint
          --from ${{ github.event.pull_request.base.sha }}
          --to ${{ github.event.pull_request.head.sha }}
          --verbose

  # One check for branch protection to require. The matrix above expands to a
  # different set of job names whenever it changes, so requiring the individual
  # jobs means protection silently stops covering a platform the day someone
  # adds one. `needs` + an explicit result test cannot drift that way: a
  # skipped or cancelled dependency fails this too.
  ci-ok:
    name: ci
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: ${{ always() }}
    needs: [check, packaging, smoke, cli, docs, demo, shell, commits]
    steps:
      - name: Report
        run: |
          echo '${{ toJSON(needs) }}'
          # `skipped` is fine — `commits` only runs on pull requests.
          if echo '${{ toJSON(needs) }}' | grep -qE '"result":[[:space:]]*"(failure|cancelled)"'; then
            echo "at least one required job did not pass"; exit 1
          fi
          echo "all required jobs passed"
