# Release, driven by changesets.
#
# The flow, end to end:
#   1. A change that should ship adds a changeset (`pnpm changeset`), committed
#      alongside the code.
#   2. On merge to main this workflow opens (or updates) a "Version Packages"
#      PR: it applies the pending changesets, bumps the affected packages and
#      writes their CHANGELOG.md.
#   3. Merging that PR runs this workflow again, finds no pending changesets,
#      and publishes the newly versioned packages to npm.
#
# Step 3 is inert until an NPM_TOKEN secret exists — until then the workflow
# still opens and maintains the version PR, so versions and changelogs stay
# correct whether or not the packages are being published yet.
name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write # push the version branch and tags
      pull-requests: write # open the "Version Packages" PR
      id-token: write # npm provenance
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - run: pnpm install --frozen-lockfile

      # Never publish something that does not pass the gate — and for a publish
      # the gate is `check:all`, not `check`.
      #
      # `check` proves the code is correct. It says nothing about whether the
      # TARBALL is: a wrong `exports` map, a missing `types` condition, a `dist`
      # that shipped a test artifact, or a package that resolves in the workspace
      # and not outside it all pass `check` and then break on install. That is
      # exactly what `check:packaging` (publint + are-the-types-wrong) and
      # `check:install` (a real `npm install` of eleven packed tarballs in a
      # throwaway project) exist to catch, and a publish is the one moment they
      # must not be skipped.
      #
      # It costs a few minutes. Unpublishing a broken version costs more: npm
      # keeps the version number spent either way.
      - run: pnpm run check:all

      - uses: changesets/action@v1
        with:
          version: pnpm run release:version
          publish: pnpm run release:publish
          commit: 'chore(repo): version packages'
          title: 'chore(repo): version packages'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          # Signs every tarball with a link back to the exact commit and workflow
          # run that built it, so a consumer can verify the code they read on
          # GitHub is the code they installed.
          #
          # Its precondition is now met: all eleven manifests carry `repository`
          # (with `directory`), pointing at the public repo. It was off before
          # only because they did not — provenance without them fails the publish
          # rather than securing it.
          #
          # Requires `id-token: write`, granted above, and an NPM_TOKEN that is a
          # GRANULAR or automation token: npm refuses provenance from a classic
          # token with 2FA on publish.
          NPM_CONFIG_PROVENANCE: true
