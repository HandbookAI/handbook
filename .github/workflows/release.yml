# Release, driven by changesets.
#
# The flow, end to end:
#   1. A change that should ship adds a changeset (`pnpm changeset`), committed
#      alongside the code.
#   2. On merge to main this workflow opens (or updates) a "Version Packages"
#      PR: it applies the pending changesets, bumps the affected packages and
#      writes their CHANGELOG.md.
#   3. Merging that PR runs this workflow again, finds no pending changesets,
#      and publishes the newly versioned packages to npm.
#
# Step 3 is inert until an NPM_TOKEN secret exists — until then the workflow
# still opens and maintains the version PR, so versions and changelogs stay
# correct whether or not the packages are being published yet.
name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write # push the version branch and tags
      pull-requests: write # open the "Version Packages" PR
      id-token: write # npm provenance
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - run: pnpm install --frozen-lockfile

      # Never publish something that does not pass the gate.
      - run: pnpm check

      - uses: changesets/action@v1
        with:
          version: pnpm version-packages
          publish: pnpm release
          commit: 'chore(repo): version packages'
          title: 'chore(repo): version packages'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: true
